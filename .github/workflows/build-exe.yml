name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (例如: v1.5.3.0 或 v1.5.2，留空代表自動抓取最新)'
        required: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 自動取得 Tag 名稱（若無輸入則自動尋找最新 Tag）
      - name: Set Release Tag
        id: vars
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -eq "main" -or [string]::IsNullOrWhiteSpace($tag)) {
            $tag = (gh release list --limit 1 | ForEach-Object { $_.Split("`t")[2] })
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 從指定的 Release 下載 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download ${{ steps.vars.outputs.TAG }} --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安裝 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 4. 編譯安裝包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 5. 上傳 Output 資料夾下的 EXE 回該 Release 頁面
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
