name: Build Installer EXE

on:
  release:
    types: [published] # 當你在 GitHub 發布新的 Release 時自動觸發
  workflow_dispatch: # 也允許手動觸發執行

jobs:
  build:
    runs-on: windows-latest # 使用 GitHub 提供的雲端 Windows 電腦

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Assets
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: 'latest'
          file: 'Calculator_1.5.2.0_x64.msix'
          target: 'Calculator_1.5.2.0_x64.msix'

      - name: Compile Inno Setup Script
        uses: Lagarde-Olivier/action-innosetup@v1
        with:
          script: setup.iss

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: Output/Calculator_Setup_v1.5.2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
