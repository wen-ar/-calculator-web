name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 精確指定下載 v1.5.2 Release 的 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download v1.5.2 --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安裝官方 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 3. 執行打包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 4. 上傳產生的 .exe 回 v1.5.2 Release 頁面
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.5.2"
          files: Output/Calculator_Setup_v1.5.2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
