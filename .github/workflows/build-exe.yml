name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 使用 GitHub 官方 CLI 工具下載最新 Release 的 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 安裝 Inno Setup
      - name: Install Inno Setup
        uses: MinchinWeb/action-innosetup@v1

      # 編譯打包出 .exe
      - name: Compile Inno Setup Script
        run: |
          ISCC.exe setup.iss

      # 將打包好的 .exe 自動傳回 Release 頁面
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: Output/Calculator_Setup_v1.5.2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
