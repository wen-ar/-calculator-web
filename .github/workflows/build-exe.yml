name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 自動偵測最新的 Release Tag 名稱
      - name: Auto Detect Latest Release Tag
        id: vars
        run: |
          # 取得最新發布的 Release Tag 名稱
          $latestTag = (gh release list --limit 1 | ForEach-Object { $_.Split("`t")[2] })
          if ([string]::IsNullOrWhiteSpace($latestTag)) {
            Write-Error "找不到任何已發布的 Release！請確認 GitHub Releases 是否已發布。"
            exit 1
          }
          Write-Host "自動偵測到最新的 Release Tag: $latestTag"
          echo "TAG=$latestTag" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 自動下載該 Release 中的 .msix 檔案
      - name: Download MSIX from Latest Release
        run: |
          gh release download ${{ steps.vars.outputs.TAG }} --pattern "*.msix" --dir . --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安裝 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 4. 編譯安裝包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 5. 上傳產出的 EXE 檔案回到該 Release
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
