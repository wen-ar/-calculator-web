name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 動態下載當前 Release 的 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download ${{ github.ref_name }} --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安裝官方 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 3. 執行 Inno Setup 編譯（請確保 setup.iss 存在於儲存庫根目錄）
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 4. 上傳產生的 .exe（請確保路徑與 setup.iss 中的 OutputDir / OutputBaseFilename 一致）
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
