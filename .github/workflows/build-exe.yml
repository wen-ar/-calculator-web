name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (例如: v1.5.3)'
        required: true
        default: 'v1.5.3'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 取得 Tag 名稱
      - name: Set Release Tag
        id: vars
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          Write-Output "TAG=$tag" >> $env:GITHUB_OUTPUT

      # 2. 列出目前的 Releases（用於排查 Debug，看系統到底抓到什麼 Tag）
      - name: Debug List Releases
        run: |
          echo "=== 目前專案中的 Release 清單 ==="
          gh release list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 下載 MSIX 檔案（加上詳盡日誌）
      - name: Download MSIX from Release
        run: |
          echo "準備下載 Tag: ${{ steps.vars.outputs.TAG }} 的 .msix 檔案..."
          gh release download ${{ steps.vars.outputs.TAG }} --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 安裝 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 5. 編譯安裝包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 6. 上傳 Output 資料夾下的 EXE 回 Release 頁面
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
