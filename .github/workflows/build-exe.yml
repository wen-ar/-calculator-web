name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 下載該 Release 頁面上的 msix 與 cer 檔
      - name: Download MSIX and CER from Release
        run: |
          gh release download ${{ github.ref_name }} --pattern "*.msix" --dir .
          gh release download ${{ github.ref_name }} --pattern "*.cer" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安裝 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 3. 編譯安裝包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 4. 將 Output 內的 .exe 上傳回 GitHub Release
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
