name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 使用官方 CLI 下載最新 Release 的 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 直接透過 Chocolatey 安裝官方 Inno Setup（最穩定，不求人！）
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 3. 執行編譯（安裝後 iscc 會自動加入系統路徑）
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 4. 上傳產生的 .exe 回 Release 頁面
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: Output/Calculator_Setup_v1.5.2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
