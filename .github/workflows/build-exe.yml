name: Build Installer EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download from (e.g. v1.5.2)'
        required: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 自動判斷當前的 Tag 名稱
      - name: Set Release Tag
        id: vars
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      # 1. 只需要從 Release 下載 .msix 檔案
      - name: Download MSIX from Release
        run: |
          gh release download ${{ steps.vars.outputs.TAG }} --pattern "*.msix" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安裝 Inno Setup
      - name: Install Inno Setup via Choco
        run: |
          choco install innosetup --no-progress -y

      # 3. 編譯安裝包
      - name: Compile Inno Setup Script
        run: |
          iscc setup.iss

      # 4. 將 Output 資料夾下的 EXE 上傳回該 Release
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
