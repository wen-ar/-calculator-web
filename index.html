        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        * { font-family: 'Inter', 'Noto Sans TC', -apple-system, Segoe UI, sans-serif; }
        :root { --radius: 22px; --radius-sm: 16px; --radius-xs: 12px; }
        [data-theme='light'] .dark-only { display: none !important; }
        [data-theme='dark'] .light-only { display: none !important; }
        .fluent-blur {
          backdrop-filter: blur(20px) saturate(180%);
          -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .win-shadow {
          box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04) inset, 0 10px 30px rgba(99,102,241,0.08);
        }
        .win-shadow-dark {
          box-shadow: 0 8px 24px rgba(0,0,0,0.32), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 10px 30px rgba(168,85,247,0.12);
        }
        .grid-animate {
          display: grid;
          transition: grid-template-rows 0.38s cubic-bezier(0.4,0,0.2,1);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #0078D4; border-radius: 22px; }
        /* Unified 22px system */
        button, a {
          transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
          border-radius: 22px;
        }
        .pill-btn {
          border-radius: 22px;
          transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .pill-cta {
          border-radius: 22px;
          padding: 14px 28px;
          box-shadow: 0 4px 14px rgba(0,120,212,0.22), 0 1px 4px rgba(0,120,212,0.15);
          transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .pill-cta:hover {
          box-shadow: 0 6px 20px rgba(0,120,212,0.28), 0 2px 8px rgba(0,120,212,0.18);
          transform: translateY(-1px);
        }
        .pill-cta:active {
          transform: translateY(0px);
          box-shadow: 0 2px 8px rgba(0,120,212,0.18);
        }
        .pill-badge {
          border-radius: 22px;
          border-width: 1px;
          transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .pill-badge:hover {
          transform: translateY(-0.5px);
          box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        /* Optimized image cards - no float animation */
        .shot-card {
          border-radius: 22px;
          overflow: hidden;
          transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), box-shadow 0.4s cubic-bezier(0.4,0,0.2,1);
          will-change: transform;
        }
        .shot-card:hover {
          transform: scale(1.01);
        }
        .shot-light {
          box-shadow: 0 8px 28px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04) inset;
        }
        .shot-dark {
          box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
        }
        .unified-22 {
          border-radius: 22px !important;
        }
